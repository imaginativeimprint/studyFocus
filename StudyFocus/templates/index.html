<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFocus - Todo List with Timer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="StudyFocus Logo">
                <h1>StudyFocus</h1>
            </div>
            <p>Boost your productivity with timed study sessions!</p>
        </header>

        <div class="main-content">
            <!-- Timer Section -->
            <div class="timer-section">
                <h2><i class="fas fa-clock"></i> Study Timer</h2>
                <div class="timer-display" id="timer">25:00</div>
                <div class="timer-controls">
                    <button id="start-timer" class="btn timer-btn"><i class="fas fa-play"></i> Start</button>
                    <button id="pause-timer" class="btn timer-btn"><i class="fas fa-pause"></i> Pause</button>
                    <button id="reset-timer" class="btn timer-btn"><i class="fas fa-redo"></i> Reset</button>
                </div>
                <div class="timer-settings">
                    <div class="setting">
                        <label for="study-time">Study Time (min):</label>
                        <input type="number" id="study-time" min="1" value="25">
                    </div>
                    <div class="setting">
                        <label for="break-time">Break Time (min):</label>
                        <input type="number" id="break-time" min="1" value="5">
                    </div>
                </div>
                <div class="timer-status" id="timer-status">Ready to study!</div>
            </div>

            <!-- Todo List Section -->
            <div class="todo-section">
                <h2><i class="fas fa-tasks"></i> Study Tasks</h2>
                <div class="todo-form">
                    <input type="text" id="todo-input" placeholder="Add a new study task...">
                    <input type="text" id="subject-input" placeholder="Subject (e.g., Math)">
                    <button id="add-task" class="btn"><i class="fas fa-plus"></i> Add Task</button>
                </div>
                <div class="todo-list" id="todo-list">
                    <!-- Tasks will be added here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
